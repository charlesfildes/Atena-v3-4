steps:
- name: 'mobiledevops/android-sdk-image:34.0.0'
  entrypoint: 'bash'
  args:
    - '-c'
    - |
      mkdir -p /tmp/src /tmp/.gradle /workspace/output
      cp -r . /tmp/src
      cd /tmp/src
      chmod +x gradlew
      
      # Executa a compilação e exibe apenas os erros Kotlin
      ./gradlew assembleDebug --no-daemon -g /tmp/.gradle > /tmp/build.log 2>&1
      BUILD_STATUS=$?
      
      if [ $BUILD_STATUS -eq 0 ]; then
        cp app/build/outputs/apk/debug/*.apk /workspace/output/
      else
        echo "=========================================="
        echo "          ERRO DE CÓDIGO KOTLIN           "
        echo "=========================================="
        grep -E "e: /|error:" /tmp/build.log || tail -n 40 /tmp/build.log
        echo "=========================================="
        exit 1
      fi

artifacts:
  objects:
    location: 'gs://arched-science-453116-h5_cloudbuild/apks/'
    paths:
      - 'output/*.apk'
