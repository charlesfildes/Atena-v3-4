steps:
  - name: 'ubuntu:latest'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        # Prepara diretórios de trabalho e cópia limpa
        mkdir -p /tmp/src /tmp/.gradle /tmp/output
        cp -r . /tmp/src
        cd /tmp/src
        chmod +x gradlew

        # Executa a compilação do APK utilizando a configuração do Wrapper
        ./gradlew assembleDebug --no-daemon -g /tmp/.gradle > /tmp/build.log 2>&1
        BUILD_STATUS=$$?

        if [ $$BUILD_STATUS -eq 0 ]; then
          cp app/build/outputs/apk/debug/*.apk /tmp/output/
          cp -r /tmp/output /workspace/
        else
          echo "=========================================="
          echo "       ERRO DE COMPILAÇÃO DO KOTLIN       "
          echo "=========================================="
          grep -B 40 -A 5 "BUILD FAILED" /tmp/build.log || tail -n 60 /tmp/build.log
          echo "=========================================="
          exit 1
        fi

artifacts:
  objects:
    location: 'gs://arched-science-453116-h5-atena-apks/'
    paths:
      - '/tmp/output/*.apk'

options:
  logging: CLOUD_LOGGING_ONLY
