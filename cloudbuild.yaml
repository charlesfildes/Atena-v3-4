steps:
- name: 'mobiledevops/android-sdk-image:34.0.0'
  entrypoint: 'bash'
  env:
    - 'GRADLE_USER_HOME=/tmp/gradle_home'
  args:
    - '-c'
    - |
      mkdir -p /tmp/gradle_home
      chmod +x gradlew
      ./gradlew assembleDebug --no-daemon -g /tmp/gradle_home --stacktrace

artifacts:
  objects:
    location: 'gs://arched-science-453116-h5_cloudbuild/apks/'
    paths:
      - 'app/build/outputs/apk/debug/*.apk'
