steps:
- name: 'mobiledevops/android-sdk-image:34.0.0'
  entrypoint: 'bash'
  env:
    - 'GRADLE_USER_HOME=/tmp/.gradle'
  args:
    - '-c'
    - |
      rm -rf /workspace/.gradle
      mkdir -p /tmp/.gradle
      chmod +x gradlew
      ./gradlew assembleDebug --stacktrace

artifacts:
  objects:
    location: 'gs://arched-science-453116-h5_cloudbuild/apks/'
    paths:
      - 'app/build/outputs/apk/debug/*.apk'
