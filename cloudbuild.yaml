steps:
  - name: 'mobiledevops/android-sdk-image:34.0.0'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        # Configura o sistema para usar o OpenJDK 17 pré-instalado na imagem
        update-alternatives --set java /usr/lib/jvm/java-17-openjdk-amd64/bin/java || true
        update-alternatives --set javac /usr/lib/jvm/java-17-openjdk-amd64/bin/javac || true

        # Define as variáveis de ambiente ativas
        export JAVA_HOME=/usr/lib/jvm/java-17-openjdk-amd64
        export PATH=$$JAVA_HOME/bin:$$PATH

        echo "--- Versão do Java configurada ---"
        java -version
        echo "JAVA_HOME: $$JAVA_HOME"

        mkdir -p /tmp/src /tmp/.gradle /tmp/output
        cp -r . /tmp/src
        cd /tmp/src
        chmod +x gradlew

        ./gradlew assembleDebug --no-daemon -g /tmp/.gradle > /tmp/build.log 2>&1
        BUILD_STATUS=$$?

        if [ $$BUILD_STATUS -eq 0 ]; then
          cp app/build/outputs/apk/debug/*.apk /tmp/output/
          cp -r /tmp/output /workspace/
        else
          echo "=========================================="
          echo "       ERRO DE COMPILAÇÃO DO KOTLIN       "
          echo "=========================================="
          grep -B 40 -A 5 "BUILD FAILED" /tmp/build.log || tail -n 60 /tmp/build.log
          echo "=========================================="
          exit 1
        fi

artifacts:
  objects:
    location: 'gs://arched-science-453116-h5_cloudbuild/apks/'
    paths:
      - '/tmp/output/*.apk'

options:
  logging: CLOUD_LOGGING_ONLY
