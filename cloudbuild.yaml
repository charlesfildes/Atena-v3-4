steps:
  - name: 'mobiledevops/android-sdk-image:34.0.0'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        # Instala o JDK 17 e força a alternância do sistema
        apt-get update -qq && apt-get install -y -qq openjdk-17-jdk
        update-java-alternatives --set $(update-java-alternatives -l | grep 17 | awk '{print $1}') || true

        # Define JAVA_HOME apontando para o binário do Java 17 recém-configurado
        export JAVA_HOME=$(readlink -f /usr/bin/java | sed "s:/bin/java::")
        export PATH=$$JAVA_HOME/bin:$$PATH

        echo "--- Versão do Java configurada ---"
        java -version
        echo "JAVA_HOME ativo: $$JAVA_HOME"

        mkdir -p /tmp/src /tmp/.gradle /tmp/output
        cp -r . /tmp/src
        cd /tmp/src
        chmod +x gradlew

        ./gradlew assembleDebug --no-daemon -g /tmp/.gradle > /tmp/build.log 2>&1
        BUILD_STATUS=$$?

        if [ $$BUILD_STATUS -eq 0 ]; then
          cp app/build/outputs/apk/debug/*.apk /tmp/output/
          cp -r /tmp/output /workspace/
        else
          echo "=========================================="
          echo "       ERRO DE COMPILAÇÃO DO KOTLIN       "
          echo "=========================================="
          grep -B 40 -A 5 "BUILD FAILED" /tmp/build.log || tail -n 60 /tmp/build.log
          echo "=========================================="
          exit 1
        fi

artifacts:
  objects:
    location: 'gs://arched-science-453116-h5_cloudbuild/apks/'
    paths:
      - '/tmp/output/*.apk'

options:
  logging: CLOUD_LOGGING_ONLY
