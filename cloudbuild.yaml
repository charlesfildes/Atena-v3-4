steps:
- name: 'mobiledevops/android-sdk-image:34.0.0'
  entrypoint: 'bash'
  args:
    - '-c'
    - |
      rm -rf /workspace/.gradle
      chmod +x gradlew
      ./gradlew assembleDebug -g /tmp/.gradle --no-daemon --stacktrace

artifacts:
  objects:
    location: 'gs://arched-science-453116-h5_cloudbuild/apks/'
    paths:
      - 'app/build/outputs/apk/debug/*.apk'
