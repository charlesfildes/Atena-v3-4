steps:
- name: 'mobiledevops/android-sdk-image:34.0.0'
  entrypoint: 'bash'
  args:
    - '-c'
    - |
      mkdir -p /tmp/src /tmp/.gradle /workspace/output
      cp -r . /tmp/src
      cd /tmp/src
      chmod +x gradlew
      
      # Executa o build sem declarar variáveis com $
      ./gradlew assembleDebug --no-daemon -g /tmp/.gradle --stacktrace
      
      cp app/build/outputs/apk/debug/*.apk /workspace/output/

artifacts:
  objects:
    location: 'gs://arched-science-453116-h5_cloudbuild/apks/'
    paths:
      - 'output/*.apk'
